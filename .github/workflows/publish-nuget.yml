name: Publish NuGet packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore RabbitMQ.ClientKit.sln

      - name: Build
        run: dotnet build RabbitMQ.ClientKit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RabbitMQ.ClientKit.sln --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack RabbitMQ.ClientKit.sln --configuration Release --no-build --output ./artifacts

      - name: Authenticate to NuGet.org
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish packages
        shell: bash
        run: |
          shopt -s nullglob
          packages=(./artifacts/*.nupkg)

          if [ ${#packages[@]} -eq 0 ]; then
            echo "No .nupkg files found in ./artifacts"
            exit 1
          fi

          for package in "${packages[@]}"; do
            if [[ "$package" == *.snupkg ]]; then
              continue
            fi

            echo "Publishing $package"
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

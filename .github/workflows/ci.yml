name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore RabbitMQ.ClientKit.sln

      - name: Build
        run: dotnet build RabbitMQ.ClientKit.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test RabbitMQ.ClientKit.sln --configuration Release --no-build --verbosity normal
